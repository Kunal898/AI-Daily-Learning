name: Daily Educational Content Generator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_date:
        description: 'Force specific date (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate Daily Content
        run: |
          if [ -n "${{ github.event.inputs.force_date }}" ]; then
            python generate.py --date "${{ github.event.inputs.force_date }}"
          else
            python generate.py
          fi

      - name: Build Search Index
        run: |
          python build_index.py

      - name: Update README Statistics
        run: |
          python update_readme.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add output/ INDEX.md TAGS.md search_index.json README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto(daily): generate lesson and update stats [skip ci]"
            git push
          fi
